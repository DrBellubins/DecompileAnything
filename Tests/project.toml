# Benchmark configuration. Tests/eval.py reads this; the decomp tool is meant to read
# the same shape of file per target binary (see Docs/Design-Plan.md, project.toml).

std = "c++17"
threshold = 97.0          # a unit only counts as done above this...
cppflags = []             # ...and only if the opcode stream also matches (no opcode diffs)
linkflags = []

# Where a candidate may find the headers of the program being decompiled. `decomp try` adds
# these as -I when it builds a candidate (Docs/Design-Plan.md, Phase 2). A relative path is
# relative to this file.
include_dirs = ["TestBinary", "TestBinary/TestFunctions"]

# The analysis side, read by the `decomp` CLI (Docs/Setup.md §3). eval.py ignores this
# table; both tools read the same file on purpose. cache_dir is relative to this file, so
# the analysis cache stays in the repo's gitignored cache/ - which must not be a
# dot-prefixed path element (Ghidra's ProjectLocator rejects those).
[ghidra]
install_dir = ""             # empty = GHIDRA_INSTALL_DIR, then /opt/ghidra, then `ghidra` on PATH
cache_dir = "../cache/ghproj"
language = ""                # empty = let Ghidra auto-select (x86:LE:64:default here)

# The variant name is the build directory name under Tests/build/.
# gcc -O0 x86-64 is the entry point of the progression in the design plan:
# -O0 free functions -> class methods -> virtual dispatch -> -O2, with -m32 as the
# closer match to the 32-bit MSVC targets.
[variants.gcc-o0]
compiler = "g++"
optimize = 0
arch = "x86-64"

[variants.gcc-o2]
compiler = "g++"
optimize = 2
arch = "x86-64"

[variants.gcc-o0-x86]
compiler = "g++"
optimize = 0
arch = "x86"
# -no-pie: on i386 a PIE link relaxes the pc-thunk/GOT sequence into %gs addressing,
#   so the linked code would not match the object code of the same source.
# static: the 32-bit dynamic loader/runtime is often missing, and goldens must run.
cppflags = ["-no-pie", "-fno-pic"]
linkflags = ["-no-pie", "-static"]

# To try another toolchain locally, add a variant, e.g.:
# [variants.clang-o0]
# compiler = "clang++"
# optimize = 0
# arch = "x86-64"

# MSVC (Docs/MSVC-Plan.md MS-2). Needs the toolchain of Docs/Setup.md §6 on PATH:
#   PATH=$PWD/toolchains/msvc/bin/x64:$PATH
# `cl` spells its flags differently (decomp.toolchain.build_flags turns optimize=0 into /Od
# and optimize=2 into /O2, and driver_form() turns those into cl's own argument form), and a
# PE has no ELF symbol sizes - eval.py reads its function boundaries out of `.pdata`, the
# compiler's own function table, and its names out of the map file it asks link for.
# /MT, not /MD: the reference binary must run under Wine, and a /MD build needs a VC runtime
# redist installed that this machine does not have.
[variants.msvc-o0]
compiler = "cl"
optimize = 0
arch = "x86-64"
cppflags = ["/MT"]
linkflags = ["/SUBSYSTEM:CONSOLE"]

[variants.msvc-o2]
compiler = "cl"
optimize = 2
arch = "x86-64"
cppflags = ["/MT"]
linkflags = ["/SUBSYSTEM:CONSOLE"]

# A PE built by GCC. Not an MSVC variant and never an MSVC stand-in (Docs/MSVC-Plan.md §1):
# the flags above would not apply to it and the codegen is GCC's. It is here because it is
# the only PE this machine can build without a Windows SDK, so it is what exercises eval.py's
# PE answer key (.pdata + map file) and the Wine runner.
[variants.mingw-o0]
compiler = "x86_64-w64-mingw32-g++"
optimize = 0
arch = "x86-64"
linkflags = ["-static", "-static-libgcc", "-static-libstdc++"]
